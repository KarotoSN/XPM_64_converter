<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image → XPM Converter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --bg2: #17171a;
    --bg3: #1f1f23;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0ede8;
    --text2: #8a8784;
    --text3: #555350;
    --accent: #c8f060;
    --accent2: #a0d040;
    --info: #60b0f0;
    --success: #60e0a0;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --sans: 'DM Sans', 'Outfit', system-ui, sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 5rem;
    min-height: 100vh;
  }

  header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeUp 0.5s ease both;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .subtitle {
    color: var(--text2);
    font-size: 14px;
    margin-top: 4px;
  }

  .container {
    width: 100%;
    max-width: 680px;
    animation: fadeUp 0.5s 0.1s ease both;
  }

  /* Drop zone */
  #drop-zone {
    border: 1.5px dashed var(--border2);
    border-radius: var(--radius-lg);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    background: var(--bg2);
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    user-select: none;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(200, 240, 96, 0.04);
  }
  #drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon {
    font-size: 2.5rem;
    margin-bottom: 0.75rem;
  }
  .drop-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .drop-sub {
    font-size: 13px;
    color: var(--text2);
  }

  /* Preview */
  #preview-section { display: none; }

  .file-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .file-name {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 70%;
  }
  #reset-btn {
    background: none;
    border: 0.5px solid var(--border2);
    border-radius: 6px;
    color: var(--text2);
    font-family: var(--sans);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    transition: color 0.1s, border-color 0.1s;
  }
  #reset-btn:hover { color: var(--text); border-color: var(--text2); }

  .canvas-row {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .canvas-box { flex: 1; min-width: 140px; }
  .canvas-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: repeating-conic-gradient(#222 0% 25%, #2a2a2a 0% 50%) 0 0 / 10px 10px;
    width: 100%;
    max-width: 220px;
    aspect-ratio: 1;
  }

  .stats-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  .stat {
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text2);
  }
  .stat span { color: var(--accent); font-weight: 500; }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
    align-items: center;
  }
  #filename-input {
    flex: 1;
    min-width: 160px;
    font-family: var(--mono);
    font-size: 13px;
    height: 40px;
    padding: 0 12px;
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  #filename-input:focus { border-color: var(--accent); }

  #btn-download {
    height: 40px;
    padding: 0 20px;
    background: var(--accent);
    color: #0e0e10;
    border: none;
    border-radius: var(--radius);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  #btn-download:hover { background: var(--accent2); }
  #btn-download:active { transform: scale(0.97); }

  .xpm-preview {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    max-height: 200px;
    overflow-y: auto;
    white-space: pre;
    line-height: 1.7;
  }
  .xpm-preview::-webkit-scrollbar { width: 4px; }
  .xpm-preview::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  .kw { color: var(--info); }
  .str { color: var(--success); }
  .cm { color: var(--text3); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.5rem; }
    #drop-zone { padding: 2rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🎨</div>
  </div>
  <h1>Image <span>→</span> XPM</h1>
  <p class="subtitle">Resize to 64×64 and export as X PixMap format</p>
</header>

<div class="container">
  <div id="drop-zone">
    <input type="file" id="file-input" accept="image/*">
    <div class="drop-icon">📁</div>
    <div class="drop-title">Drop your image here</div>
    <div class="drop-sub">or click to browse — PNG, JPG, GIF, WebP…</div>
  </div>

  <div id="preview-section">
    <div class="file-bar">
      <div class="file-name" id="file-name-display"></div>
      <button id="reset-btn">✕ reset</button>
    </div>

    <div class="canvas-row">
      <div class="canvas-box">
        <div class="canvas-label">Original</div>
        <canvas id="canvas-orig"></canvas>
      </div>
      <div class="canvas-box">
        <div class="canvas-label">64 × 64 preview</div>
        <canvas id="canvas-scaled" width="64" height="64"></canvas>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat">size <span id="stat-size">—</span></div>
      <div class="stat">colors <span id="stat-colors">—</span></div>
      <div class="stat">output <span id="stat-bytes">—</span></div>
    </div>

    <div class="controls">
      <input type="text" id="filename-input" value="icon_64" placeholder="filename (no extension)">
      <button id="btn-download" onclick="downloadXPM()">⬇ download .xpm</button>
    </div>

    <div class="xpm-preview" id="xpm-preview"></div>
  </div>
</div>

<script>
  let xpmContent = '';

  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const previewSection = document.getElementById('preview-section');
  const canvasOrig = document.getElementById('canvas-orig');
  const canvasScaled = document.getElementById('canvas-scaled');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) processFile(file);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) processFile(fileInput.files[0]);
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    previewSection.style.display = 'none';
    dropZone.style.display = '';
    fileInput.value = '';
    xpmContent = '';
  });

  function processFile(file) {
    document.getElementById('file-name-display').textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        drawOrig(img);
        drawScaled(img);
        const baseName = file.name.replace(/\.[^.]+$/, '') || 'icon_64';
        document.getElementById('filename-input').value = baseName;
        xpmContent = generateXPM(canvasScaled, baseName);
        dropZone.style.display = 'none';
        previewSection.style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function drawOrig(img) {
    const ctx = canvasOrig.getContext('2d');
    canvasOrig.width = img.naturalWidth;
    canvasOrig.height = img.naturalHeight;
    ctx.clearRect(0, 0, canvasOrig.width, canvasOrig.height);
    ctx.drawImage(img, 0, 0);
  }

  function drawScaled(img) {
    const ctx = canvasScaled.getContext('2d');
    ctx.clearRect(0, 0, 64, 64);
    ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 64, 64);
  }

  const CHARS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-+=[]{}|;:,.<>?~_';

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function generateXPM(canvas, name) {
    const ctx = canvas.getContext('2d');
    const data = ctx.getImageData(0, 0, 64, 64).data;

    const colorMap = new Map();
    const pixels = [];
    let colorIndex = 0;

    for (let i = 0; i < 64 * 64; i++) {
      const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2], a = data[i * 4 + 3];
      const key = a < 128 ? 'TRANSPARENT' : rgbToHex(r, g, b);
      if (!colorMap.has(key)) colorMap.set(key, colorIndex++);
      pixels.push(key);
    }

    const numColors = colorMap.size;
    const cpp = numColors <= CHARS.length ? 1 : 2;
    const getChar = idx => cpp === 1 ? CHARS[idx] : CHARS[Math.floor(idx / CHARS.length)] + CHARS[idx % CHARS.length];

    const colorEntries = [];
    colorMap.forEach((idx, key) => {
      const ch = getChar(idx).padEnd(cpp);
      colorEntries.push(`"${ch} c ${key === 'TRANSPARENT' ? 'None' : key}"`);
    });

    const rows = [];
    for (let y = 0; y < 64; y++) {
      let row = '"';
      for (let x = 0; x < 64; x++) {
        row += getChar(colorMap.get(pixels[y * 64 + x]));
      }
      row += (y < 63) ? '",' : '"';
      rows.push(row);
    }

    const safeName = name.replace(/[^a-zA-Z0-9_]/g, '_');
    const xpm = [
      `/* XPM */`,
      `static char *${safeName}[] = {`,
      `/* columns rows colors chars-per-pixel */`,
      `"64 64 ${numColors} ${cpp}",`,
      `/* colors */`,
      ...colorEntries.map((e, i) => e + (i < colorEntries.length - 1 ? ',' : ',')),
      `/* pixels */`,
      ...rows,
      `};`
    ].join('\n');

    document.getElementById('stat-size').textContent = `${canvasOrig.width}×${canvasOrig.height}`;
    document.getElementById('stat-colors').textContent = numColors;
    document.getElementById('stat-bytes').textContent = formatBytes(new Blob([xpm]).size);
    renderPreview(colorEntries, rows, numColors, cpp);
    return xpm;
  }

  function formatBytes(n) {
    return n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderPreview(colorEntries, rows, numColors, cpp) {
    const shown = Math.min(colorEntries.length, 8);
    let h = `<span class="kw">/* XPM */</span>\n`;
    h += `<span class="kw">static char</span> *icon[] = {\n`;
    h += `  <span class="cm">/* columns rows colors chars-per-pixel */</span>\n`;
    h += `  <span class="str">"64 64 ${numColors} ${cpp}"</span>,\n`;
    h += `  <span class="cm">/* colors */</span>\n`;
    for (let i = 0; i < shown; i++) {
      h += `  <span class="str">${escHtml(colorEntries[i])}</span>,\n`;
    }
    if (colorEntries.length > shown) {
      h += `  <span class="cm">  … ${colorEntries.length - shown} more colors …</span>\n`;
    }
    h += `  <span class="cm">/* pixels */</span>\n`;
    for (let i = 0; i < 3; i++) {
      h += `  <span class="str">${escHtml(rows[i].substring(0, 40))}…</span>\n`;
    }
    h += `  <span class="cm">  … 61 more rows …</span>\n`;
    h += `};`;
    document.getElementById('xpm-preview').innerHTML = h;
  }

  function downloadXPM() {
    const name = document.getElementById('filename-input').value.trim() || 'icon_64';
    const safeName = name.replace(/[^a-zA-Z0-9_]/g, '_');
    xpmContent = generateXPM(canvasScaled, safeName);
    const blob = new Blob([xpmContent], { type: 'image/x-xpm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = safeName + '.xpm';
    a.click();
  }
</script>
</body>
</html>
